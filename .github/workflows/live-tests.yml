name: Live-Tests

# Die Unit-Tests laufen gegen aufgezeichnete Antworten und bleiben gruen,
# wenn sich die Quelle aendert. Genau das ist am 3.8.2026 im Portfolio
# passiert: vier von sechs Datensaetzen produktiv kaputt, alle Unit-Tests
# gruen. Dieser Lauf haelt die Zusicherungen gegen api.library.ethz.ch.
#
# Die beiden Live-Tests brauchen keinen API-Key: sie messen, welche Routen
# das Gateway fuehrt (401 = Route da, Schluessel fehlt; 404 = Route weg).
# Deshalb laeuft dieser Workflow ohne Secret.

on:
  schedule:
    # Taeglich 06:17 UTC. Nicht zur vollen Stunde: dann ist die Warteschlange
    # von GitHub am laengsten und der Lauf verschiebt sich unvorhersehbar.
    - cron: "17 6 * * *"
  # Damit die Aenderung an diesem Workflow pruefbar ist, ohne einen Tag zu
  # warten - geplante Laeufe starten ausserdem nur vom Default-Branch.
  workflow_dispatch:

permissions:
  contents: read
  issues: write # nur fuer das Issue, das ein roter Lauf aufmacht

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      # Eine Version genuegt. Geprueft wird ein Netz-Vertrag, kein Verhalten,
      # das sich zwischen 3.11 und 3.13 unterscheiden koennte.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      # `continue-on-error`, damit die Einordnung in jedem Fall laeuft. Rot
      # wird der Job weiter unten, aus dem eingeordneten Ergebnis.
      - name: Run live tests
        id: suite
        continue-on-error: true
        run: |
          set +e
          PYTHONPATH=src pytest tests/ -m live \
            --junitxml=live-report.xml 2>&1 | tee live-tests.log
          echo "pytest_exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # Hier stand die Sonderbehandlung von Exit-Code 5: nichts eingesammelt,
      # also rot. Der Gedanke war richtig — ein Lauf, der null Tests faehrt und
      # gruen meldet, sieht wie Abdeckung aus, und genau so fing dieses Repo an.
      # Er griff nur einen Fall von dreien:
      #
      #   * null eingesammelt — Exit 5, wurde erkannt;
      #   * alle eingesammelten uebersprungen — Exit 0, sah aus wie Erfolg;
      #   * pytest kam gar nicht bis zum Laufen — Exit irgendwas, sah unter
      #     `if: failure()` aus wie ein gebrochener Vertrag mit der Quelle.
      #
      # Der Exit-Code kann diese drei nicht trennen; das JUnit-XML kann es, weil
      # es Tests, Uebersprungene, Fehlschlaege und Fehler getrennt zaehlt.
      - name: Ergebnis einordnen
        id: verdict
        env:
          PYTEST_EXIT: ${{ steps.suite.outputs.pytest_exit }}
        run: |
          args=(live-report.xml)
          if [ -n "$PYTEST_EXIT" ]; then
            args+=(--pytest-exit "$PYTEST_EXIT")
          fi
          python scripts/classify_live_run.py "${args[@]}"

      - name: Bei Rot ein Issue oeffnen oder ergaenzen
        if: steps.verdict.outputs.state == 'finding'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create live-test-failure \
            --color B60205 \
            --description "Ein geplanter Live-Test gegen api.library.ethz.ch ist rot." \
            --force

          {
            echo "Der geplante Live-Test-Lauf ist rot: $RUN_URL"
            echo
            echo "**Erst die Quelle abfragen, dann einordnen.** Nicht aus der"
            echo "Fehlermeldung schliessen: «nicht gefunden» hiess in diesem"
            echo "Portfolio schon einmal nicht, dass der Datensatz weg war,"
            echo "sondern dass die Quelle ihre Kopfzeile umbenannt hatte."
            echo
            echo "Was gemessen wurde:"
            echo
            echo '```'
            tail -c 4000 live-tests.log 2>/dev/null || echo "(keine Ausgabe aufgezeichnet)"
            echo '```'
          } > issue-body.md

          offen=$(gh issue list --label live-test-failure --state open --limit 1 --json number --jq '.[0].number // empty')

          if [ -n "$offen" ]; then
            gh issue comment "$offen" --body-file issue-body.md
          else
            gh issue create \
              --title "Live-Test rot ($(date -u +%F)): api.library.ethz.ch" \
              --label live-test-failure \
              --body-file issue-body.md
          fi

      # Erst hier wird der Job rot. `clear` ist gruen; `finding` und `unknown`
      # sind beide rot, aber nur `finding` hat oben ein Issue erzeugt — der
      # Unterschied steht im Log, nicht im Exit-Code.
      #
      # Ueber `env`, nicht ueber `${{ }}` im Skript: Der Grund kann eine
      # Parser-Meldung ueber eine fremde Datei enthalten, und `${{ }}` setzt sie
      # vor dem Start woertlich in die Shell ein.
      - name: Ergebnis durchreichen
        if: steps.verdict.outputs.state != 'clear'
        env:
          LIVE_STATE: ${{ steps.verdict.outputs.state }}
          LIVE_REASON: ${{ steps.verdict.outputs.reason }}
        run: |
          echo "Live-Suite: $LIVE_STATE"
          echo "$LIVE_REASON"
          exit 1
