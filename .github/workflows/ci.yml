name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          PYTHONPATH=src pytest tests/ -m "not live"

      # ruff is pinned in pyproject.toml's dev extra and installed above, so an
      # upstream release cannot change the default rule set or formatter and
      # break CI on unrelated, untouched code. Do not add a second pin here:
      # two pins drift, and the local run would silently diverge from CI again.
      # Der Pin wirkt nur, wenn `ruff` ihn auch aufruft: liegt frueher im
      # PATH ein anderes ruff, gewinnt jenes, und der Install meldet nichts.
      - name: Ruff-Pin (PATH und Modul gegen pyproject.toml)
        run: python scripts/check_ruff_pin.py

      - name: Lint
        run: ruff check src/ tests/ scripts/

      - name: Format check
        run: ruff format --check src/ tests/ scripts/

      - name: Versions-Sync (pyproject ↔ server.json / README / src)
        run: python scripts/check_version_sync.py

  # Eigener Job, nicht ein weiterer Schritt oben: Der Build haengt an keiner
  # Python-Version der Matrix -- das Dockerfile bringt seine eigene mit. In der
  # Matrix liefe derselbe Build dreimal identisch.
  #
  # Warum es ihn gibt: Das Dockerfile war bis zum 19.9.2026 nicht baubar. Es
  # kopierte `pyproject.toml README.md` ohne `LICENSE`, waehrend `pyproject.toml`
  # die Datei unter `license = { file = "LICENSE" }` fuehrt -- hatchling bricht
  # dann ab. Behoben wurde das von Hand (Commit f4ab5b5); gemerkt hat es
  # niemand, weil kein Gate den Container je gebaut hat. Die CI war die ganze
  # Zeit gruen.
  #
  # `docker build .` und sonst nichts: kein Push, keine Registry, keine
  # Zugangsdaten. Gebaut wird gegen die Regeln in `.dockerignore` -- faellt dort
  # eine Datei heraus, die das Dockerfile kopiert, faellt dieser Job.
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Container bauen (ohne Push)
        run: docker build .
